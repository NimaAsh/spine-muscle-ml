[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spine-muscle-ml"
version = "0.1.0"
description = "Code and OpenSim utilities for subject-specific muscle parameter prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Nima"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
torch = ["torch>=2.2"]

[project.scripts]
osim-parse = "osim_parser.parser:_cli"

[tool.setuptools]
packages = ["osim_parser", "examples"]
py-modules = ["repo_config"]
